ignore_merge_commits = true
ignore_fixup_commits = true
tag_prefix = "v"
branch_whitelist = ["master"]

# Bumps are explicit; publishing a release is a separate action.
pre_bump_hooks = [
    "perl -pi -e 's/^version = \".*\"/version = \"{{version}}\"/' cjpm.toml",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "FilaCo"
repository = "jian"
